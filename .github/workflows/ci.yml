name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
      - run: npm run build:vercel
      - run: npm run typecheck
      - run: npm test
      - run: npx eslint app/api app/error.tsx app/imprint app/layout.tsx lib/jobs.ts lib/supabase.ts --ignore-pattern dist --ignore-pattern .next
