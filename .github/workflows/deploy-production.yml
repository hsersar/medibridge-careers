name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application and Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:vercel

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply production migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          SUPABASE_DATABASE_URL="$(node -e 'const password = encodeURIComponent(process.env.SUPABASE_DB_PASSWORD); process.stdout.write(`postgresql://postgres.idzahhvslobjywqyklml:${password}@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require`)')"
          baseline_versions=(
            20260831220000
            20260901080000
            20260901093000
            20260901110000
            20260901130000
            20260901143000
            20260901223000
            20260905190000
            20260906120000
            20260906140000
            20260907090000
            20260907100000
            20260907123000
            20260907150000
            20260912100000
          )
          migration_list="$(supabase migration list --db-url "$SUPABASE_DATABASE_URL")"
          applied_baseline=0
          for version in "${baseline_versions[@]}"; do
            if grep -Eq "$version.*$version" <<< "$migration_list"; then
              applied_baseline=$((applied_baseline + 1))
            fi
          done
          if [ "$applied_baseline" -eq 0 ]; then
            supabase migration repair "${baseline_versions[@]}" \
              --status applied \
              --db-url "$SUPABASE_DATABASE_URL"
          elif [ "$applied_baseline" -ne "${#baseline_versions[@]}" ]; then
            echo "::error::Remote migration history is only partially initialized ($applied_baseline/${#baseline_versions[@]} baseline migrations)."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DATABASE_URL"
          unset SUPABASE_DATABASE_URL

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          for function in supabase/functions/*/; do
            [ "$(basename "$function")" = "_shared" ] && continue
            supabase functions deploy "$(basename "$function")" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Apply Cloudflare R2 CORS policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f8a3fe2b7030acfedb73ee30cd0ccd1
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler r2 bucket cors set medibridge-candidate-documents \
            --file cloudflare/r2-cors-wrangler.json

      - name: Verify Vercel Git production deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          for attempt in $(seq 1 30); do
            deployments="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=20")"
            deployment_status="$(DEPLOYMENTS_JSON="$deployments" node -e '
              const payload = JSON.parse(process.env.DEPLOYMENTS_JSON);
              const deployment = payload.deployments?.find(
                (item) => item.meta?.githubCommitSha === process.env.GITHUB_SHA,
              );
              process.stdout.write(deployment?.state ?? "PENDING");
            ')"
            if [ "$deployment_status" = "READY" ]; then
              echo "Vercel production deployment for $GITHUB_SHA is ready."
              exit 0
            fi
            if [ "$deployment_status" = "ERROR" ] || [ "$deployment_status" = "CANCELED" ]; then
              echo "::error::Vercel production deployment finished with $deployment_status."
              exit 1
            fi
            echo "Waiting for Vercel production deployment ($attempt/30): $deployment_status"
            sleep 10
          done
          echo "::error::Timed out waiting for the Vercel production deployment."
          exit 1
