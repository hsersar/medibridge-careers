name: Database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump production database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > medibridge-db-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: medibridge-database-backup-${{ github.run_id }}
          path: medibridge-db-*.sql.gz
          retention-days: 30
